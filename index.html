
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leadpulse - Deal Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Vesper Logic Design System Tokens */
        :root {
            /* Primary "Burple" Palette */
            --color-primary: #635BFF;
            --color-primary-hover: #4F46E5;
            --color-primary-soft: #F0F1FF;
            --color-primary-light: rgba(99, 91, 255, 0.1);
            --color-primary-glow: rgba(99, 91, 255, 0.35);

            /* Legacy accent (kept for compatibility) */
            --color-accent: #635BFF;
            --color-accent-warm: #FF754C;

            /* Surface & Background */
            --color-surface: #FFFFFF;
            --color-surface-muted: #F8F9FB;
            --color-canvas: #F8F9FB;

            /* Borders */
            --color-border: #F1F3F5;
            --color-border-strong: #E2E8F0;

            /* Text Hierarchy */
            --color-text-main: #191C1E;
            --color-text-body: #4A5568;
            --color-text-muted: #94A3B8;
            --color-text-primary: #191C1E;
            --color-text-secondary: #4A5568;

            /* Status */
            --color-success: #10B981;
            --color-warning: #F59E0B;
            --color-error: #EF4444;

            /* 4px baseline grid spacing */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 12px;
            --space-lg: 16px;
            --space-xl: 24px;
            --space-2xl: 32px;

            /* Shadows */
            --shadow-card: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-soft: 0px 4px 16px rgba(99, 91, 255, 0.08);
            --shadow-button: 0px 4px 12px rgba(99, 91, 255, 0.35);

            /* Radii */
            --radius-card: 6px;
            --radius-button: 6px;
            --radius-pill: 9999px;

            /* Layout */
            --sidebar-width: 260px;
            --header-height: 64px;
        }
        
        body {
            font-family: 'Manrope', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        h1, h2, h3 {
            font-family: 'Newsreader', Georgia, serif;
            letter-spacing: -0.01em;
        }
        
        /* Dark mode (default) */
        html.dark body {
            background-color: #0a0a0a;
            color: #ededed;
        }
        
        /* Light mode - Vesper Logic: Clean & Compact */
        html.light body {
            background-color: var(--color-surface-muted);
            color: var(--color-text-main);
        }
        
        /* Vesper Logic Card Atom */
        .vl-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
        }
        html.dark .vl-card {
            background: #141414;
            border-color: rgba(255,255,255,0.06);
        }
        
        /* Primary Button - Burple */
        .btn-primary {
            background: var(--color-primary);
            color: white;
            border-radius: var(--radius-button);
            box-shadow: var(--shadow-button);
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            background: var(--color-primary-hover);
            transform: translateY(-1px);
            box-shadow: 0px 6px 16px rgba(99, 91, 255, 0.45);
        }
        
        /* Active nav pill style */
        html.light .nav-active {
            background: var(--color-primary-soft);
            color: var(--color-primary);
        }

        /* Label-Caps utility */
        .label-caps {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        html.dark .custom-scrollbar::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        html.dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }
        html.light .custom-scrollbar::-webkit-scrollbar-track {
            background: var(--color-border);
        }
        html.light .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 10px;
        }
        .glass-panel {
            backdrop-filter: blur(12px);
        }
        html.dark .glass-panel {
            background: rgba(26, 26, 26, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        html.light .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--color-border);
        }
    </style>

</head>

</body>
</html>
